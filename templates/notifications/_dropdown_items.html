<div class="o-notif-head">
  <span>{% translate "Bildirimler" %}</span>
  {% if nav_notification_count %}<span class="o-badge o-badge--danger o-badge--sm">{{ nav_notification_count }}</span>{% endif %}
</div>
{% for notification in nav_notifications %}
  <form method="post" action="{% url 'notification-read' notification.pk %}"
        data-notification-read data-notification-redirect="{{ notification.url }}">
    {% csrf_token %}
    <button class="o-notif-item" type="submit">
      {{ notification.message|truncatechars:90 }}
      <span class="o-notif-time">{{ notification.created_at|date:"d M, H:i" }}</span>
    </button>
  </form>
{% empty %}
  <div class="o-notif-empty">
    <i class="bi bi-bell-slash" aria-hidden="true"></i>
    <p>{% translate "Yeni bildirim yok" %}</p>
  </div>
{% endfor %}
<a class="o-notif-foot" href="{% url 'notification-list' %}">{% translate "Tümünü Gör" %}</a>
