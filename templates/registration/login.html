<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap - Reflow Coffee ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#111827; min-height:100vh; display:flex; align-items:center; justify-content:center;">
    <div class="card shadow" style="width: 360px;">
        <div class="card-body p-4">
            <h4 class="mb-1">☕ Reflow Coffee ERP</h4>
            <p class="text-muted mb-4">Devam etmek için giriş yapın</p>
            {% if form.errors %}
                <div class="alert alert-danger py-2">Kullanıcı adı veya şifre hatalı.</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Kullanıcı adı</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Şifre</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn btn-primary w-100">Giriş Yap</button>
            </form>
        </div>
    </div>
</body>
</html>
