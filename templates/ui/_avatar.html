{% if url %}<a href="{{ url }}" class="o-avatar o-avatar--{{ size }}" style="--o-avatar-hue:{{ hue }};" title="{{ title }}">{{ initial }}</a>
{% else %}<span class="o-avatar o-avatar--{{ size }}" style="--o-avatar-hue:{{ hue }};" title="{{ title }}" aria-hidden="true">{{ initial }}</span>{% endif %}
