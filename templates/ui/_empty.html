{% if colspan %}<tr class="o-empty-row"><td colspan="{{ colspan }}">{% endif %}
<div class="o-empty">
  <i class="bi {{ icon }} o-empty-icon" aria-hidden="true"></i>
  <p class="o-empty-title">{{ title }}</p>
  {% if text %}<p class="o-empty-text">{{ text }}</p>{% endif %}
  {% if action_url and action_label %}
    <a href="{{ action_url }}" class="o-btn o-btn--primary o-btn--sm">{{ action_label }}</a>
  {% endif %}
</div>
{% if colspan %}</td></tr>{% endif %}
